<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" fill="none">
  <!-- Circular Badge -->
  <g transform="translate(4, 4)">
    <!-- Outer Rim -->
    <circle cx="36" cy="36" r="35" fill="#EC2588" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="36" cy="36" r="32" fill="none" stroke="#F9EAF1" stroke-width="1.2" stroke-dasharray="2,2"/>
    
    <!-- Stylized Telangana Map Silhouette in background -->
    <path d="M26 19 C31 17, 43 18, 48 23 C52 27, 49 33, 51 38 C53 43, 47 48, 44 51 C39 55, 33 53, 27 50 C23 47, 21 41, 23 35 C24 30, 22 23, 26 19 Z" fill="#D81775" opacity="0.6"/>

    <!-- Car Election Symbol (White with Pink Windows) -->
    <g transform="translate(18, 25)">
      <!-- Car Body -->
      <path d="M3 17 L7 9 C8.5 6 11.5 5 15 5 L23 5 C26.5 5 29.5 6 31 9 L35 17 C37 17.5 38 19 38 21 L38 23.5 C38 24.5 37 25 36 25 L34 25 C34 22.8 32.2 21 30 21 C27.8 21 26 22.8 26 25 L12 25 C12 22.8 10.2 21 8 21 C5.8 21 4 22.8 4 25 L2 25 C1 25 0 24.5 0 23.5 L0 21 C0 19 1 17.5 3 17 Z" fill="#FFFFFF"/>
      
      <!-- Windshield / Windows -->
      <path d="M9 9.5 L17 9.5 L17 15 L5.5 15 Z" fill="#C91870"/>
      <path d="M19 9.5 L27 9.5 L30.5 15 L19 15 Z" fill="#C91870"/>
      
      <!-- Wheels -->
      <circle cx="8" cy="25" r="4" fill="#24212A" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="8" cy="25" r="1.5" fill="#FFFFFF"/>
      <circle cx="30" cy="25" r="4" fill="#24212A" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="30" cy="25" r="1.5" fill="#FFFFFF"/>
      
      <!-- Headlight & bumper detail -->
      <rect x="35" y="19" width="2" height="2.5" rx="0.5" fill="#FFF080"/>
      <rect x="1" y="19" width="1.5" height="2" rx="0.5" fill="#FF4444"/>
    </g>
    
    <!-- Arch text around circle "BRS" -->
    <text x="36" y="66" font-family="'Outfit', 'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TELANGANA</text>
  </g>

  <!-- Typography Identity -->
  <g transform="translate(86, 16)">
    <!-- Telugu Tagline / Header -->
    <text x="0" y="12" font-family="'Tiro Telugu', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#EC2588">భారత్ రాష్ట్ర సమితి</text>
    
    <!-- Main English Brand Name -->
    <text x="0" y="32" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="900" fill="#24212A" letter-spacing="0.5">BHARAT RASHTRA SAMITHI</text>
    
    <!-- Constituency Subtitle with accent line -->
    <g transform="translate(0, 43)">
      <rect x="0" y="1" width="14" height="2.5" rx="1" fill="#31552D"/>
      <text x="20" y="5.5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#EC2588" letter-spacing="1.2">WARANGAL WEST CONSTITUENCY</text>
    </g>
  </g>
</svg>
